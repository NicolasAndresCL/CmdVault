[project]
name = "cmdvault-backend"
version = "1.2.1"
requires-python = ">=3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
# El ejecutable `pytest` (CI) no añade el cwd al sys.path como `python -m pytest`.
pythonpath = ["."]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/seed/validate.py"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "BLE"]
