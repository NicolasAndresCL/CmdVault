name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint + contrato del seed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: "**/requirements*.txt"
      - run: pip install ruff==0.17.1 pydantic==2.14.1
      - run: ruff check backend frontend
      - run: ruff format --check backend frontend
      - name: Validar biblioteca de comandos
        working-directory: backend
        run: python -m app.seed.validate
      - name: hadolint
        run: |
          for f in backend frontend; do docker run --rm -i hadolint/hadolint < "$f/Dockerfile"; done

  iac:
    name: IaC (Terraform + Ansible)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Terraform fmt/validate, tflint, Trivy y ansible-lint en contenedores fijados: el mismo
      # script que usan el Jenkinsfile y scripts/verificar.sh.
      - run: ./scripts/lint-iac.sh

  test-backend:
    name: Tests backend (SQLite)
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -rs --cov --cov-report=term-missing --cov-fail-under=90

  test-postgres:
    name: Tests backend (Postgres 18)
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -rs

  test-frontend:
    name: Tests frontend
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: frontend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -rs --cov --cov-report=term-missing --cov-fail-under=80

  build:
    name: Build + arranque del stack
    needs: [iac, test-backend, test-postgres, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: .env efímero para CI
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "API_KEY=$(openssl rand -hex 24)"
            echo "STORAGE_SECRET=$(openssl rand -hex 24)"
          } > .env
      - run: docker compose build
      - run: docker compose up -d --wait --wait-timeout 180
      - run: ./scripts/smoke.sh
      - name: Logs si falla
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
